<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কৃষি পরামর্শ - ৮ বিভাগ</title>
<style>
body{font-family:sans-serif;background:#f0f7e6;margin:0}
.header{background:#2e7d32;color:white;padding:12px;text-align:center}
.division-bar{display:flex;overflow-x:auto;gap:6px;padding:8px;background:white}
.div-btn{padding:6px 12px;border-radius:20px;border:1px solid #2e7d32;background:white;white-space:nowrap;cursor:pointer}
.div-btn.active{background:#2e7d32;color:white}
#chat{height:65vh;overflow-y:auto;padding:15px}
.msg{padding:10px 15px;border-radius:15px;margin:8px 0;max-width:80%}
.user{background:#c8e6c9;margin-left:auto}
.bot{background:white}
.input-area{display:flex;padding:10px;background:white;position:fixed;bottom:0;width:100%;box-sizing:border-box}
input{flex:1;padding:12px;border-radius:25px;border:1px solid #ccc}
button{margin-left:6px;padding:12px;border:none;border-radius:50%;background:#2e7d32;color:white;width:45px;height:45px;cursor:pointer}
</style>
</head>
<body>
<div class="header">🌾 কৃষি পরামর্শ - ৮ বিভাগ</div>
<div class="division-bar">
<button class="div-btn active" onclick="setDiv('sylhet',this)">সিলেট</button>
<button class="div-btn" onclick="setDiv('dhaka',this)">ঢাকা</button>
<button class="div-btn" onclick="setDiv('chattogram',this)">চট্টগ্রাম</button>
<button class="div-btn" onclick="setDiv('rajshahi',this)">রাজশাহী</button>
<button class="div-btn" onclick="setDiv('khulna',this)">খুলনা</button>
<button class="div-btn" onclick="setDiv('barishal',this)">বরিশাল</button>
<button class="div-btn" onclick="setDiv('rangpur',this)">রংপুর</button>
<button class="div-btn" onclick="setDiv('mymensingh',this)">ময়মনসিংহ</button>
</div>

<div id="chat"><div class="msg bot">আপনার বিভাগ সিলেক্ট করুন। তারপর প্রশ্ন করুন বা মাইকে চাপ দিয়ে বলুন।</div></div>

<div class="input-area">
<input id="inp" placeholder="লিখুন...">
<button onclick="startVoice()">🎤</button>
<button onclick="send()">➤</button>
</div>

<script>
let currentDiv = 'sylhet';
function setDiv(div, el){
 currentDiv = div;
 document.querySelectorAll('.div-btn').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
}

async function send(){
 let i=document.getElementById('inp'); if(!i.value.trim()) return;
 let c=document.getElementById('chat');
 const userText = i.value.replace(/</g,'&lt;');
 c.innerHTML+=`<div class="msg user">${userText}</div>`;
 let q=i.value; i.value='';
 c.scrollTop=c.scrollHeight;
 try{
  let res=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q, division:currentDiv})});
  if(!res.ok) throw new Error('HTTP '+res.status);
  let data=await res.json();
  const reply = (data && data.reply) ? data.reply : 'দুঃখিত, উত্তর পাওয়া যায়নি। আবার চেষ্টা করুন।';
  c.innerHTML+=`<div class="msg bot">${reply}</div>`;
  c.scrollTop=c.scrollHeight;
  try{
   let utter = new SpeechSynthesisUtterance(reply);
   utter.lang = 'bn-BD';
   speechSynthesis.cancel();
   speechSynthesis.speak(utter);
  }catch(e){}
 }catch(err){
  c.innerHTML+=`<div class="msg bot">⚠️ সার্ভারের সাথে যোগাযোগ হচ্ছে না। Flask চলছে কিনা দেখুন (python app.py)।</div>`;
  c.scrollTop=c.scrollHeight;
 }
}

function startVoice(){
 const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!SpeechRecognition){ alert('Voice support নেই'); return; }
 let rec = new SpeechRecognition();
 rec.lang = 'bn-BD';
 rec.start();
 rec.onresult = (e)=>{
  document.getElementById('inp').value = e.results[0][0].transcript;
  send();
 }
}
document.getElementById('inp').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
